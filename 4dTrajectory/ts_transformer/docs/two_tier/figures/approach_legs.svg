<svg xmlns="http://www.w3.org/2000/svg" width="960" height="652" viewBox="0 0 960 652" font-family="Noto Sans CJK SC, Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif">
<rect x="0" y="0" width="960" height="652" fill="white" stroke="none"/>
<text x="40.0" y="26.0" font-size="15" text-anchor="start" fill="#111827" font-weight="bold">进场的几段航线：五边是什么（示意，不是真实数据）</text>
<text x="40.0" y="52.0" font-size="13" text-anchor="start" fill="#111827" font-weight="bold">A　起落航线的五条边（示意，不按比例；左航线：绕行一侧在落地方向的左边）</text>
<rect x="330.0" y="209.0" width="200.0" height="12" fill="#e5e7eb" stroke="#6b7280"/>
<text x="430.0" y="219.0" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal">跑道</text>
<line x1="330.0" y1="206.0" x2="330.0" y2="224.0" stroke="#111827" stroke-width="3"/>
<text x="330.0" y="201.0" font-size="11" text-anchor="middle" fill="#111827" font-weight="normal">入口</text>
<line x1="180.0" y1="215.0" x2="330.0" y2="215.0" stroke="#2563eb" stroke-width="2"/>
<path d="M 261.0 215.0 L 250.0 219.0 L 250.0 211.0 Z" fill="#2563eb"/>
<text x="255.0" y="235.0" font-size="12" text-anchor="middle" fill="#2563eb" font-weight="normal">五边 final（最后进近）</text>
<line x1="530.0" y1="215.0" x2="680.0" y2="215.0" stroke="#2563eb" stroke-width="2"/>
<path d="M 611.0 215.0 L 600.0 219.0 L 600.0 211.0 Z" fill="#2563eb"/>
<text x="605.0" y="235.0" font-size="12" text-anchor="middle" fill="#2563eb" font-weight="normal">一边 upwind</text>
<line x1="680.0" y1="215.0" x2="680.0" y2="85.0" stroke="#2563eb" stroke-width="2"/>
<path d="M 680.0 144.0 L 684.0 155.0 L 676.0 155.0 Z" fill="#2563eb"/>
<text x="690.0" y="154.0" font-size="12" text-anchor="start" fill="#2563eb" font-weight="normal">二边 crosswind</text>
<line x1="680.0" y1="85.0" x2="180.0" y2="85.0" stroke="#2563eb" stroke-width="2"/>
<path d="M 424.0 85.0 L 435.0 81.0 L 435.0 89.0 Z" fill="#2563eb"/>
<text x="430.0" y="75.0" font-size="12" text-anchor="middle" fill="#2563eb" font-weight="normal">三边 downwind（下风边）：与落地方向相反</text>
<line x1="180.0" y1="85.0" x2="180.0" y2="215.0" stroke="#2563eb" stroke-width="2"/>
<path d="M 180.0 156.0 L 176.0 145.0 L 184.0 145.0 Z" fill="#2563eb"/>
<text x="170.0" y="154.0" font-size="12" text-anchor="end" fill="#2563eb" font-weight="normal">四边 base（基线）</text>
<text x="748.0" y="177.0" font-size="11" text-anchor="start" fill="#6b7280" font-weight="normal">落地方向</text>
<line x1="748.0" y1="185.0" x2="808.0" y2="185.0" stroke="#6b7280" stroke-width="2"/>
<path d="M 816.0 185.0 L 805.0 189.0 L 805.0 181.0 Z" fill="#6b7280"/>
<text x="748.0" y="235.0" font-size="11" text-anchor="start" fill="#6b7280" font-weight="normal">起飞后：一边 → 二边</text>
<text x="748.0" y="251.0" font-size="11" text-anchor="start" fill="#6b7280" font-weight="normal">进场落地：三边 → 四边 → 五边</text>
<text x="40.0" y="270.0" font-size="13" text-anchor="start" fill="#111827" font-weight="bold">B　雷达引导的进场：本项目数据里的样子（按比例画，只有跑道画宽了）</text>
<polygon points="781.3,460.3 60.0,454.7 60.0,467.1 781.3,461.5" fill="#bbf7d0" stroke="#16a34a" stroke-width="0.5"/>
<line x1="60.0" y1="460.9" x2="781.3" y2="460.9" stroke="#9ca3af" stroke-width="1.0" stroke-dasharray="5,4"/>
<rect x="781.3" y="456.9" width="83.2" height="8" fill="#e5e7eb" stroke="#6b7280"/>
<line x1="781.3" y1="453.9" x2="781.3" y2="467.9" stroke="#111827" stroke-width="3"/>
<text x="781.3" y="482.9" font-size="11" text-anchor="middle" fill="#111827" font-weight="normal">入口</text>
<text x="822.9" y="482.9" font-size="11" text-anchor="middle" fill="#6b7280" font-weight="normal">跑道</text>
<line x1="503.9" y1="454.9" x2="503.9" y2="466.9" stroke="#111827" stroke-width="2"/>
<text x="507.9" y="450.9" font-size="11" text-anchor="start" fill="#111827" font-weight="normal">FAF（示意）</text>
<line x1="452.5" y1="454.9" x2="452.5" y2="466.9" stroke="#111827" stroke-width="2"/>
<text x="448.5" y="450.9" font-size="11" text-anchor="end" fill="#111827" font-weight="normal">进近门</text>
<polyline points="906.1,322.2 233.8,322.2 230.5,322.3 227.1,322.8 223.8,323.5 220.6,324.5 217.4,325.8 214.4,327.4 211.6,329.2 208.9,331.3 206.4,333.6 204.1,336.1 202.0,338.7 200.2,341.6 198.7,344.6 197.4,347.7 196.3,351.0 195.6,354.3 195.2,357.6 195.0,361.0 195.0,394.3 195.2,397.7 195.6,401.1 196.3,404.4 197.4,407.6 198.7,410.7 200.2,413.7 202.0,416.6 204.1,419.3 206.4,421.8 208.9,424.1 211.6,426.1 214.4,427.9 262.5,455.7 265.5,457.3 268.7,458.6 271.9,459.6 275.2,460.3 278.6,460.8 281.9,460.9 781.3,460.9" fill="none" stroke="#2563eb" stroke-width="2"/>
<path d="M 60.0 488.6 Q 115.5 460.9 171.0 460.9" fill="none" stroke="#ea580c" stroke-width="2"/>
<path d="M 564.0 322.2 L 575.0 318.2 L 575.0 326.2 Z" fill="#2563eb"/>
<path d="M 195.0 383.7 L 191.0 372.7 L 199.0 372.7 Z" fill="#2563eb"/>
<path d="M 243.7 444.8 L 232.2 442.8 L 236.2 435.9 Z" fill="#2563eb"/>
<path d="M 634.7 460.9 L 623.7 464.9 L 623.7 456.9 Z" fill="#2563eb"/>
<path d="M 99.0 472.5 L 89.9 479.9 L 87.2 472.4 Z" fill="#ea580c"/>
<circle cx="262.5" cy="455.7" r="4" fill="#111827"/>
<circle cx="281.9" cy="460.9" r="4" fill="#16a34a"/>
<text x="614.8" y="312.2" font-size="12" text-anchor="middle" fill="#2563eb" font-weight="normal">三边（下风边）：与落地方向相反，飞过跑道</text>
<text x="185.0" y="381.7" font-size="12" text-anchor="end" fill="#2563eb" font-weight="normal">四边（基线）</text>
<text x="204.4" y="441.9" font-size="12" text-anchor="end" fill="#2563eb" font-weight="normal">切入航向：与五边成 30°</text>
<text x="272.5" y="425.7" font-size="12" text-anchor="start" fill="#111827" font-weight="normal">许可加入（本项目标在截获转弯起点）</text>
<line x1="270.5" y1="429.7" x2="265.5" y2="450.7" stroke="#111827" stroke-width="1.0"/>
<text x="291.9" y="488.9" font-size="12" text-anchor="start" fill="#16a34a" font-weight="normal">截获：进入走廊 = 建立在五边上</text>
<line x1="289.9" y1="476.9" x2="284.9" y2="465.9" stroke="#16a34a" stroke-width="1.0"/>
<text x="670.3" y="448.9" font-size="12" text-anchor="middle" fill="#2563eb" font-weight="normal">五边：沿中线的延长线下降到入口</text>
<text x="60.0" y="510.6" font-size="12" text-anchor="start" fill="#ea580c" font-weight="normal">直线进近：不飞三边、四边，直接切上五边</text>
<text x="822.9" y="358.6" font-size="11" text-anchor="start" fill="#6b7280" font-weight="normal">落地方向</text>
<line x1="822.9" y1="366.6" x2="882.9" y2="366.6" stroke="#6b7280" stroke-width="2"/>
<path d="M 890.9 366.6 L 879.9 370.6 L 879.9 362.6 Z" fill="#6b7280"/>
<line x1="642.6" y1="533.0" x2="781.3" y2="533.0" stroke="#111827" stroke-width="2"/>
<line x1="642.6" y1="529.0" x2="642.6" y2="537.0" stroke="#111827" stroke-width="1.0"/>
<line x1="781.3" y1="529.0" x2="781.3" y2="537.0" stroke="#111827" stroke-width="1.0"/>
<text x="711.9" y="527.0" font-size="11" text-anchor="middle" fill="#111827" font-weight="normal">5 km</text>
<text x="40.0" y="568.1" font-size="12" text-anchor="start" fill="#6b7280" font-weight="normal">绿色楔形是截获走廊，按比例画：离中线不超过 20 m + d·tan 0.45°（d 是离入口的距离，26 km 处 224 m），航迹与跑道航向差不超过 2°。</text>
<text x="40.0" y="588.1" font-size="12" text-anchor="start" fill="#6b7280" font-weight="normal">进近门在 FAF 外 1,852 m、离入口不少于 9,260 m；30° 切入要在进近门外至少 3,704 m 处切上五边（7110.65BB 5-9-1、5-9-2）。</text>
<text x="40.0" y="608.1" font-size="12" text-anchor="start" fill="#6b7280" font-weight="normal">实际的进近许可常与切入航向一起给（5-9-4 的例子）；录音不在数据里，标注器把「许可加入」放在截获转弯起点（词表设计 §2.2）。</text>
<text x="40.0" y="628.1" font-size="12" text-anchor="start" fill="#6b7280" font-weight="normal">转弯半径 1,399 m（80 m/s、坡度 25°）；三边离五边 5 km；每一段转弯都与前后两段相切。</text>
</svg>
