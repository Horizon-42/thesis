<text x="20.0" y="320.0" font-size="12" text-anchor="start" fill="#111827" font-weight="normal">实心点：这架飞机的行。时刻 = 它进入 25 km 的时刻 + 2 s × 行号，不改；它的输入和说的词按这一行。</text>
<text x="20.0" y="342.0" font-size="12" text-anchor="start" fill="#111827" font-weight="normal">实线箭头：这一行挂到最近的时间步（最多差 1 s，正好在中间时挂到后一步）。只用来把各架排进同一个时间步。</text>
<text x="20.0" y="364.0" font-size="12" text-anchor="start" fill="#111827" font-weight="normal">空心点、虚线箭头：两架之间的量按本机这一行的真实时刻算。邻机取它在这一时刻之前（含）的最后一行，按那一行的</text>
<text x="20.0" y="386.0" font-size="12" text-anchor="start" fill="#111827" font-weight="normal">速度直线推到这一时刻（不超过 2 s；邻机第一行晚于这一时刻时，用第一行往回推；inference/scene_edges.py）。</text>
<text x="20.0" y="408.0" font-size="12" text-anchor="start" fill="#111827" font-weight="normal">闭环里由执行器飞的飞机从它挂到的时间步起飞，此后的状态正好在时间步上：两架都由执行器飞时推的时间为 0。</text>
