<svg xmlns="http://www.w3.org/2000/svg" width="960" height="432" viewBox="0 0 960 432" font-family="Noto Sans CJK SC, Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif">
<rect x="0" y="0" width="960" height="432" fill="white" stroke="none"/>
<text x="60.0" y="24.0" font-size="15" text-anchor="start" fill="#111827" font-weight="bold">进近时钟上的前后：把两架飞机都投到落地方向上比（示意；两条跑道的横向间距不按比例）</text>
<text x="830.0" y="56.0" font-size="12" text-anchor="end" fill="#6b7280" font-weight="normal">落地方向</text>
<line x1="838.0" y1="52.0" x2="900.0" y2="52.0" stroke="#6b7280" stroke-width="2"/>
<path d="M 908 52 L 898 47 L 898 57 Z" fill="#6b7280"/>
<line x1="108.4" y1="182.0" x2="108.4" y2="262.0" stroke="#9ca3af" stroke-width="1.0" stroke-dasharray="2,3"/>
<line x1="314.8" y1="112.0" x2="314.8" y2="262.0" stroke="#9ca3af" stroke-width="1.0" stroke-dasharray="2,3"/>
<line x1="697.0" y1="112.0" x2="697.0" y2="262.0" stroke="#9ca3af" stroke-width="1.0" stroke-dasharray="2,3"/>
<line x1="618.0" y1="182.0" x2="618.0" y2="262.0" stroke="#9ca3af" stroke-width="1.0" stroke-dasharray="2,3"/>
<rect x="697.0" y="92" width="191.1" height="16" fill="#e5e7eb" stroke="#6b7280"/>
<line x1="697.0" y1="89.0" x2="697.0" y2="111.0" stroke="#111827" stroke-width="3"/>
<text x="792.6" y="104.0" font-size="11" text-anchor="middle" fill="#6b7280" font-weight="normal">跑道 23L</text>
<rect x="618.0" y="162" width="191.1" height="16" fill="#e5e7eb" stroke="#6b7280"/>
<line x1="618.0" y1="159.0" x2="618.0" y2="181.0" stroke="#111827" stroke-width="3"/>
<text x="713.6" y="174.0" font-size="11" text-anchor="middle" fill="#6b7280" font-weight="normal">跑道 23R</text>
<line x1="108.4" y1="170.0" x2="618.0" y2="170.0" stroke="#9ca3af" stroke-width="1.0" stroke-dasharray="4,4"/>
<path d="M 117.4 170 L 101.4 163 L 101.4 177 Z" fill="#2563eb"/>
<text x="96.4" y="175.0" font-size="14" text-anchor="end" fill="#2563eb" font-weight="bold">i</text>
<text x="363.2" y="194.0" font-size="12" text-anchor="middle" fill="#2563eb" font-weight="normal" stroke="white" stroke-width="4" stroke-linejoin="round" paint-order="stroke">i 沿航道离 23R 入口 8,000 m</text>
<line x1="314.8" y1="100.0" x2="697.0" y2="100.0" stroke="#9ca3af" stroke-width="1.0" stroke-dasharray="4,4"/>
<path d="M 323.8 100 L 307.8 93 L 307.8 107 Z" fill="#ea580c"/>
<text x="302.8" y="105.0" font-size="14" text-anchor="end" fill="#ea580c" font-weight="bold">j</text>
<text x="505.9" y="86.0" font-size="12" text-anchor="middle" fill="#ea580c" font-weight="normal" stroke="white" stroke-width="4" stroke-linejoin="round" paint-order="stroke">j 沿航道离 23L 入口 6,000 m</text>
<line x1="618.0" y1="135.0" x2="697.0" y2="135.0" stroke="#111827" stroke-width="1.5"/>
<line x1="618.0" y1="130.0" x2="618.0" y2="140.0" stroke="#111827" stroke-width="1.5"/>
<line x1="697.0" y1="130.0" x2="697.0" y2="140.0" stroke="#111827" stroke-width="1.5"/>
<text x="610.0" y="139.0" font-size="12" text-anchor="end" fill="#111827" font-weight="normal">23L 的入口沿落地方向比 23R 的靠前 1,240 m</text>
<line x1="60.0" y1="262.0" x2="920.0" y2="262.0" stroke="#111827" stroke-width="1.0"/>
<line x1="60.0" y1="262.0" x2="60.0" y2="266.0" stroke="#111827" stroke-width="1.0"/>
<text x="60.0" y="278.0" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal">−10 km</text>
<line x1="187.4" y1="262.0" x2="187.4" y2="266.0" stroke="#111827" stroke-width="1.0"/>
<text x="187.4" y="278.0" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal">−8 km</text>
<line x1="314.8" y1="262.0" x2="314.8" y2="266.0" stroke="#111827" stroke-width="1.0"/>
<text x="314.8" y="278.0" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal">−6 km</text>
<line x1="442.2" y1="262.0" x2="442.2" y2="266.0" stroke="#111827" stroke-width="1.0"/>
<text x="442.2" y="278.0" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal">−4 km</text>
<line x1="569.6" y1="262.0" x2="569.6" y2="266.0" stroke="#111827" stroke-width="1.0"/>
<text x="569.6" y="278.0" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal">−2 km</text>
<line x1="697.0" y1="262.0" x2="697.0" y2="266.0" stroke="#111827" stroke-width="1.0"/>
<text x="697.0" y="278.0" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal">0 km</text>
<line x1="824.4" y1="262.0" x2="824.4" y2="266.0" stroke="#111827" stroke-width="1.0"/>
<text x="824.4" y="278.0" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal">2 km</text>
<circle cx="108.4" cy="262" r="4" fill="#2563eb"/>
<text x="108.4" y="298.0" font-size="12" text-anchor="middle" fill="#2563eb" font-weight="bold">i −9,240 m</text>
<circle cx="314.8" cy="262" r="4" fill="#ea580c"/>
<text x="314.8" y="298.0" font-size="12" text-anchor="middle" fill="#ea580c" font-weight="bold">j −6,000 m</text>
<circle cx="697.0" cy="262" r="4" fill="#111827"/>
<text x="703.0" y="298.0" font-size="12" text-anchor="start" fill="#111827" font-weight="normal">23L 入口 0（本例的原点）</text>
<circle cx="618.0" cy="262" r="4" fill="#111827"/>
<text x="612.0" y="298.0" font-size="12" text-anchor="end" fill="#111827" font-weight="normal">23R 入口 −1,240 m</text>
<line x1="108.4" y1="326.0" x2="314.8" y2="326.0" stroke="#111827" stroke-width="1.5"/>
<line x1="108.4" y1="321.0" x2="108.4" y2="331.0" stroke="#111827" stroke-width="1.5"/>
<line x1="314.8" y1="321.0" x2="314.8" y2="331.0" stroke="#111827" stroke-width="1.5"/>
<text x="211.6" y="318.0" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">j 在 i 前面 3,240 m</text>
<text x="60.0" y="362.0" font-size="12" text-anchor="start" fill="#111827" font-weight="normal">只拿两架各自离入口的距离相减：8,000 − 6,000 = 2,000 m，少算了两个入口之间的错位 1,240 m。</text>
<text x="60.0" y="386.0" font-size="12" text-anchor="start" fill="#111827" font-weight="normal">每架的位置 = 它生效跑道的入口沿落地方向的位置（Separation.along_nm，换成米）− 它沿航道离这个入口还有多远（before_threshold_m）；</text>
<text x="60.0" y="406.0" font-size="12" text-anchor="start" fill="#111827" font-weight="normal">前后 = j 的位置 − i 的位置。原点取在哪里都不影响这个差。</text>
</svg>
