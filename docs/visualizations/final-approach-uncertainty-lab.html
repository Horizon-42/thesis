  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

html&gt;body{padding:0}&lt;/style&gt;
&lt;/head&gt;
&lt;body&gt;
&lt;div id=&quot;final-approach-uncertainty-lab&quot;&gt;
  &lt;div class=&quot;viz-controls&quot; aria-label=&quot;Uncertainty model controls&quot;&gt;
    &lt;label class=&quot;form-label&quot;&gt;Observed crossing &lt;strong data-value=&quot;estimate&quot;&gt;−2.00 m&lt;/strong&gt;
      &lt;input class=&quot;form-range&quot; data-control=&quot;estimate&quot; type=&quot;range&quot; min=&quot;-8&quot; max=&quot;11&quot; step=&quot;0.05&quot; value=&quot;-2&quot;&gt;
    &lt;/label&gt;
    &lt;label class=&quot;form-label&quot;&gt;Samples &lt;strong data-value=&quot;samples&quot;&gt;80&lt;/strong&gt;
      &lt;input class=&quot;form-range&quot; data-control=&quot;samples&quot; type=&quot;range&quot; min=&quot;8&quot; max=&quot;220&quot; step=&quot;1&quot; value=&quot;80&quot;&gt;
    &lt;/label&gt;
    &lt;label class=&quot;form-label&quot;&gt;Residual noise s &lt;strong data-value=&quot;noise&quot;&gt;3.8 m&lt;/strong&gt;
      &lt;input class=&quot;form-range&quot; data-control=&quot;noise&quot; type=&quot;range&quot; min=&quot;0.2&quot; max=&quot;8&quot; step=&quot;0.1&quot; value=&quot;3.8&quot;&gt;
    &lt;/label&gt;
    &lt;label class=&quot;form-label&quot;&gt;Lag-1 correlation &lt;strong data-value=&quot;rho&quot;&gt;0.43&lt;/strong&gt;
      &lt;input class=&quot;form-range&quot; data-control=&quot;rho&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;0.9&quot; step=&quot;0.01&quot; value=&quot;0.43&quot;&gt;
    &lt;/label&gt;
    &lt;label class=&quot;form-label&quot;&gt;Nearest sample &lt;strong data-value=&quot;nearest&quot;&gt;−325 m&lt;/strong&gt;
      &lt;input class=&quot;form-range&quot; data-control=&quot;nearest&quot; type=&quot;range&quot; min=&quot;-1200&quot; max=&quot;-50&quot; step=&quot;25&quot; value=&quot;-325&quot;&gt;
    &lt;/label&gt;
  &lt;/div&gt;

  &lt;div class=&quot;viz-grid uncertainty-stats&quot; aria-live=&quot;polite&quot;&gt;
    &lt;div class=&quot;card viz-stat&quot;&gt;&lt;span&gt;Effective samples / 有效样本&lt;/span&gt;&lt;strong class=&quot;viz-stat-value&quot; data-value=&quot;neff&quot;&gt;31.9&lt;/strong&gt;&lt;span data-value=&quot;neff-note&quot;&gt;80 measured&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;card viz-stat&quot;&gt;&lt;span&gt;Threshold sigma / 阈值标准误差&lt;/span&gt;&lt;strong class=&quot;viz-stat-value&quot; data-value=&quot;sigma&quot;&gt;1.49 m&lt;/strong&gt;&lt;span&gt;calculated from this track&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;card viz-stat&quot;&gt;&lt;span&gt;95% interval&lt;/span&gt;&lt;strong class=&quot;viz-stat-value&quot; data-value=&quot;interval&quot;&gt;[−4.92, +0.92] m&lt;/strong&gt;&lt;span data-value=&quot;verdict-note&quot;&gt;crosses a gate&lt;/span&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;section class=&quot;viz-explainer&quot; aria-labelledby=&quot;residual-heading&quot;&gt;
    &lt;h2 id=&quot;residual-heading&quot;&gt;Step 1 · Residuals become &lt;em&gt;s&lt;/em&gt; &lt;span&gt;残差如何变成 s&lt;/span&gt;&lt;/h2&gt;
    &lt;p&gt;Each stem is one point’s signed distance from the fitted line. Squaring, summing, and dividing by the remaining degrees of freedom gives the typical single-point scatter.&lt;/p&gt;
    &lt;svg data-chart=&quot;residual&quot; role=&quot;img&quot; aria-labelledby=&quot;residual-title residual-desc&quot; viewBox=&quot;0 0 900 300&quot;&gt;
      &lt;title id=&quot;residual-title&quot;&gt;Residuals and residual standard deviation&lt;/title&gt;
      &lt;desc id=&quot;residual-desc&quot;&gt;A residual strip and formula card explain how individual deviations become SSE and residual scatter s.&lt;/desc&gt;
      &lt;g data-layer=&quot;residual-grid&quot;&gt;&lt;/g&gt;
      &lt;g data-layer=&quot;residual-marks&quot;&gt;&lt;/g&gt;
    &lt;/svg&gt;
  &lt;/section&gt;

  &lt;section class=&quot;viz-explainer&quot; aria-labelledby=&quot;effective-heading&quot;&gt;
    &lt;h2 id=&quot;effective-heading&quot;&gt;Step 2 · Correlation reduces independent information &lt;span&gt;相关性会压缩有效样本&lt;/span&gt;&lt;/h2&gt;
    &lt;p&gt;The top ribbon is every recorded point. The lower ribbon is the independent-equivalent amount after consecutive residuals are found to repeat the same pattern.&lt;/p&gt;
    &lt;svg data-chart=&quot;effective&quot; role=&quot;img&quot; aria-labelledby=&quot;effective-title effective-desc&quot; viewBox=&quot;0 0 900 285&quot;&gt;
      &lt;title id=&quot;effective-title&quot;&gt;Recorded samples compared with effective samples&lt;/title&gt;
      &lt;desc id=&quot;effective-desc&quot;&gt;Two dot ribbons and a residual sequence show how lag-one autocorrelation reduces effective sample count.&lt;/desc&gt;
      &lt;g data-layer=&quot;effective-grid&quot;&gt;&lt;/g&gt;
      &lt;g data-layer=&quot;effective-marks&quot;&gt;&lt;/g&gt;
    &lt;/svg&gt;
  &lt;/section&gt;

  &lt;section class=&quot;viz-explainer&quot; aria-labelledby=&quot;assembly-heading&quot;&gt;
    &lt;h2 id=&quot;assembly-heading&quot;&gt;Step 3 · Assemble threshold sigma &lt;span&gt;把各因素合成为 σ₀&lt;/span&gt;&lt;/h2&gt;
    &lt;p&gt;&lt;em&gt;s&lt;/em&gt; measures point scatter; &lt;em&gt;n&lt;/em&gt;&lt;sub&gt;eff&lt;/sub&gt; measures usable information; the leverage term measures how far the line must be extended.&lt;/p&gt;

  &lt;svg data-chart=&quot;sigma&quot; role=&quot;img&quot; aria-labelledby=&quot;sigma-title sigma-desc&quot; viewBox=&quot;0 0 900 285&quot;&gt;
    &lt;title id=&quot;sigma-title&quot;&gt;How the threshold sigma is assembled&lt;/title&gt;
    &lt;desc id=&quot;sigma-desc&quot;&gt;A bilingual flow diagram shows how recorded sample count, autocorrelation, residual noise and extrapolation geometry combine into effective sample count and threshold sigma.&lt;/desc&gt;
    &lt;g data-layer=&quot;sigma-grid&quot;&gt;&lt;/g&gt;
    &lt;g data-layer=&quot;sigma-marks&quot;&gt;&lt;/g&gt;
  &lt;/svg&gt;
  &lt;/section&gt;

  &lt;section class=&quot;viz-explainer&quot; aria-labelledby=&quot;fit-heading&quot;&gt;
    &lt;h2 id=&quot;fit-heading&quot;&gt;Step 4 · Extrapolate to the threshold &lt;span&gt;把拟合线延长到跑道入口&lt;/span&gt;&lt;/h2&gt;
    &lt;p&gt;The solid segment is supported by samples. The dashed segment has no observations beneath it, so a longer dashed segment increases crossing uncertainty.&lt;/p&gt;

  &lt;svg data-chart=&quot;fit&quot; role=&quot;img&quot; aria-labelledby=&quot;fit-title fit-desc&quot; viewBox=&quot;0 0 900 330&quot;&gt;
    &lt;title id=&quot;fit-title&quot;&gt;Final-approach line fit and extrapolation&lt;/title&gt;
    &lt;desc id=&quot;fit-desc&quot;&gt;Synthetic samples between five kilometres and the last observation are fitted with a straight line and extrapolated to the runway threshold.&lt;/desc&gt;
    &lt;g data-layer=&quot;fit-grid&quot;&gt;&lt;/g&gt;
    &lt;g data-layer=&quot;fit-marks&quot;&gt;&lt;/g&gt;
  &lt;/svg&gt;
  &lt;/section&gt;

  &lt;section class=&quot;viz-explainer&quot; aria-labelledby=&quot;confidence-heading&quot;&gt;
    &lt;h2 id=&quot;confidence-heading&quot;&gt;Step 5 · 1.96 turns sigma into a 95% interval &lt;span&gt;1.96 如何形成置信区间&lt;/span&gt;&lt;/h2&gt;
    &lt;p&gt;The curve represents repeated fitted-crossing errors under the model—not the vertical positions of one aircraft. The middle 95% lies between estimate ± 1.96σ₀; the two tails contain 2.5% each.&lt;/p&gt;

  &lt;svg data-chart=&quot;gate&quot; role=&quot;img&quot; aria-labelledby=&quot;gate-title gate-desc&quot; viewBox=&quot;0 0 900 345&quot;&gt;
    &lt;title id=&quot;gate-title&quot;&gt;Vertical gate and confidence interval&lt;/title&gt;
    &lt;desc id=&quot;gate-desc&quot;&gt;The accepted vertical interval is minus 3.05 to plus 6.10 metres. The estimated crossing and its 95 percent interval determine the displayed verdict.&lt;/desc&gt;
    &lt;g data-layer=&quot;gate-grid&quot;&gt;&lt;/g&gt;
    &lt;g data-layer=&quot;gate-marks&quot;&gt;&lt;/g&gt;
  &lt;/svg&gt;
  &lt;/section&gt;

  &lt;section class=&quot;viz-explainer&quot; aria-labelledby=&quot;sensitivity-heading&quot;&gt;
    &lt;h2 id=&quot;sensitivity-heading&quot;&gt;Step 6 · See what changes sigma &lt;span&gt;观察哪些因素让 σ₀ 变大&lt;/span&gt;&lt;/h2&gt;
    &lt;p&gt;Each mini-chart varies only one input while holding the others at their current slider values. The dot is the current setting.&lt;/p&gt;
    &lt;svg data-chart=&quot;sensitivity&quot; role=&quot;img&quot; aria-labelledby=&quot;sensitivity-title sensitivity-desc&quot; viewBox=&quot;0 0 900 430&quot;&gt;
      &lt;title id=&quot;sensitivity-title&quot;&gt;Sensitivity of threshold sigma to four inputs&lt;/title&gt;
      &lt;desc id=&quot;sensitivity-desc&quot;&gt;Four line charts show sigma versus residual scatter, recorded sample count, autocorrelation, and distance of the nearest sample.&lt;/desc&gt;
      &lt;g data-layer=&quot;sensitivity-grid&quot;&gt;&lt;/g&gt;
      &lt;g data-layer=&quot;sensitivity-marks&quot;&gt;&lt;/g&gt;
    &lt;/svg&gt;
  &lt;/section&gt;

  &lt;div class=&quot;viz-row uncertainty-legend&quot; aria-label=&quot;Verdict legend&quot;&gt;
    &lt;span&gt;&lt;i class=&quot;legend-mark pass&quot;&gt;&lt;/i&gt; Green: interval supports inside&lt;/span&gt;
    &lt;span&gt;&lt;i class=&quot;legend-mark fail&quot;&gt;&lt;/i&gt; Red: interval supports outside&lt;/span&gt;
    &lt;span&gt;&lt;i class=&quot;legend-mark undecided&quot;&gt;&lt;/i&gt; Grey: interval crosses a boundary&lt;/span&gt;
  &lt;/div&gt;
&lt;/div&gt;

&lt;script&gt;
(() =&gt; {
  const root = document.getElementById(&#x27;final-approach-uncertainty-lab&#x27;);
  if (!root) return;
  const controls = Object.fromEntries([...root.querySelectorAll(&#x27;[data-control]&#x27;)].map(el =&gt; [el.dataset.control, el]));
  const out = name =&gt; root.querySelector(`[data-value=&quot;${name}&quot;]`);
  const residualGrid = root.querySelector(&#x27;[data-layer=&quot;residual-grid&quot;]&#x27;);
  const residualMarks = root.querySelector(&#x27;[data-layer=&quot;residual-marks&quot;]&#x27;);
  const effectiveGrid = root.querySelector(&#x27;[data-layer=&quot;effective-grid&quot;]&#x27;);
  const effectiveMarks = root.querySelector(&#x27;[data-layer=&quot;effective-marks&quot;]&#x27;);
  const fitGrid = root.querySelector(&#x27;[data-layer=&quot;fit-grid&quot;]&#x27;);
  const fitMarks = root.querySelector(&#x27;[data-layer=&quot;fit-marks&quot;]&#x27;);
  const sigmaGrid = root.querySelector(&#x27;[data-layer=&quot;sigma-grid&quot;]&#x27;);
  const sigmaMarks = root.querySelector(&#x27;[data-layer=&quot;sigma-marks&quot;]&#x27;);
  const gateGrid = root.querySelector(&#x27;[data-layer=&quot;gate-grid&quot;]&#x27;);
  const gateMarks = root.querySelector(&#x27;[data-layer=&quot;gate-marks&quot;]&#x27;);
  const sensitivityGrid = root.querySelector(&#x27;[data-layer=&quot;sensitivity-grid&quot;]&#x27;);
  const sensitivityMarks = root.querySelector(&#x27;[data-layer=&quot;sensitivity-marks&quot;]&#x27;);
  const svgNS = &#x27;http://www.w3.org/2000/svg&#x27;;
  const el = (name, attrs = {}, text = &#x27;&#x27;) =&gt; {
    const node = document.createElementNS(svgNS, name);
    for (const [key, value] of Object.entries(attrs)) node.setAttribute(key, String(value));
    if (text) node.textContent = text;
    return node;
  };
  const fmt = (v, digits = 2) =&gt; `${v &lt; 0 ? &#x27;−&#x27; : v &gt; 0 ? &#x27;+&#x27; : &#x27;&#x27;}${Math.abs(v).toFixed(digits)}`;
  const clamp = (v, lo, hi) =&gt; Math.min(hi, Math.max(lo, v));
  const seededNoise = i =&gt; Math.sin(i * 12.9898 + 4.1414) * 0.58 + Math.sin(i * 3.731) * 0.42;

  function sigmaParts(n, rho, noise, nearest) {
    const neff = Math.max(3, n * (1 - rho) / (1 + rho));
    const xStart = -5000;
    const xbar = (xStart + nearest) / 2;
    const span = nearest - xStart;
    const sxx = n * span * span / 12;
    const sxxEff = sxx * (neff / n);
    const leverage = 1 / neff + (xbar * xbar) / sxxEff;
    return { neff, xbar, sxx, sxxEff, leverage, sigma: noise * Math.sqrt(leverage) };
  }

  function correlatedResiduals(count, rho, noise) {
    const values = [];
    let previous = seededNoise(0);
    for (let i = 0; i &lt; count; i++) {
      const innovation = seededNoise(i + 1);
      previous = rho * previous + Math.sqrt(Math.max(0.01, 1 - rho * rho)) * innovation;
      values.push(previous);
    }
    const rms = Math.sqrt(values.reduce((sum, value) =&gt; sum + value * value, 0) / Math.max(1, count));
    return values.map(value =&gt; value * noise / Math.max(0.001, rms));
  }

  function drawResiduals(n, rho, noise) {
    residualGrid.replaceChildren(); residualMarks.replaceChildren();
    const x0 = 58, x1 = 590, baseline = 151;
    const shown = Math.min(36, n);
    const residuals = correlatedResiduals(shown, rho, noise);
    const amplitude = Math.max(noise * 2.4, ...residuals.map(Math.abs), 0.5);
    const sy = value =&gt; baseline - value / amplitude * 92;
    [-noise, 0, noise].forEach(value =&gt; {
      residualGrid.append(el(&#x27;line&#x27;,{x1:x0,y1:sy(value),x2:x1,y2:sy(value),class:value === 0 ? &#x27;axis&#x27; : &#x27;grid&#x27;}));
      residualGrid.append(el(&#x27;text&#x27;,{x:x0-9,y:sy(value)+4,&#x27;text-anchor&#x27;:&#x27;end&#x27;},value === 0 ? &#x27;fit line&#x27; : `${value &gt; 0 ? &#x27;+&#x27; : &#x27;−&#x27;}s`));
    });
    residualGrid.append(el(&#x27;text&#x27;,{x:x0,y:25},`${shown} illustrative residuals, scaled to the selected s`));
    residuals.forEach((value, index) =&gt; {
      const x = x0 + index / Math.max(1, shown - 1) * (x1 - x0);
      residualMarks.append(el(&#x27;line&#x27;,{x1:x,y1:baseline,x2:x,y2:sy(value),class:&#x27;residual&#x27;}));
      residualMarks.append(el(&#x27;circle&#x27;,{cx:x,cy:sy(value),r:3.5,class:&#x27;residual-dot&#x27;}));
    });
    const sse = noise * noise * Math.max(1, n - 2);
    residualMarks.append(el(&#x27;rect&#x27;,{x:630,y:34,width:242,height:224,rx:12,class:&#x27;formula-card&#x27;}));
    residualMarks.append(el(&#x27;text&#x27;,{x:650,y:65,class:&#x27;flow-main&#x27;},&#x27;From stems to one number&#x27;));
    residualMarks.append(el(&#x27;text&#x27;,{x:650,y:91},&#x27;① rᵢ = point − fitted line&#x27;));
    residualMarks.append(el(&#x27;text&#x27;,{x:650,y:119},`② SSE = Σrᵢ² = ${sse.toFixed(1)} m²`));
    residualMarks.append(el(&#x27;text&#x27;,{x:650,y:147},`③ degrees of freedom = n−2 = ${Math.max(1,n-2)}`));
    residualMarks.append(el(&#x27;text&#x27;,{x:650,y:184,class:&#x27;flow-main&#x27;},`s = √(SSE/(n−2))`));
    residualMarks.append(el(&#x27;text&#x27;,{x:650,y:217,class:&#x27;flow-main&#x27;},`s = ${noise.toFixed(1)} m`));
    residualMarks.append(el(&#x27;text&#x27;,{x:650,y:244},&#x27;单个点的典型散乱程度&#x27;));
  }

  function drawEffective(n, rho, neff, noise) {
    effectiveGrid.replaceChildren(); effectiveMarks.replaceChildren();
    const cells = 50, x0 = 60, cellW = 9.5, gap = 1.5;
    effectiveGrid.append(el(&#x27;text&#x27;,{x:x0,y:36,class:&#x27;flow-main&#x27;},`Recorded: n = ${n} points / 实际记录`));
    effectiveGrid.append(el(&#x27;text&#x27;,{x:x0,y:122,class:&#x27;flow-main&#x27;},`Independent-equivalent: n_eff = ${neff.toFixed(1)} / 有效信息`));
    for (let i = 0; i &lt; cells; i++) {
      effectiveMarks.append(el(&#x27;rect&#x27;,{x:x0+i*(cellW+gap),y:52,width:cellW,height:24,rx:3,class:&#x27;sample-cell&#x27;}));
      const active = (i + 0.5) / cells &lt;= neff / n;
      effectiveMarks.append(el(&#x27;rect&#x27;,{x:x0+i*(cellW+gap),y:138,width:cellW,height:24,rx:3,class:active?&#x27;sample-cell&#x27;:&#x27;sample-cell-muted&#x27;}));
    }
    effectiveMarks.append(el(&#x27;path&#x27;,{d:`M60 91 L605 91`,class:&#x27;flow-arrow&#x27;}));
    effectiveMarks.append(el(&#x27;text&#x27;,{x:332,y:106,&#x27;text-anchor&#x27;:&#x27;middle&#x27;},`keep ${(100*neff/n).toFixed(0)}% of nominal information`));
    const seq = correlatedResiduals(22, rho, noise);
    const seqMax = Math.max(...seq.map(Math.abs), 0.5);
    const points = seq.map((value,index) =&gt; `${650+index*9.7},${109-value/seqMax*57}`).join(&#x27; &#x27;);
    effectiveGrid.append(el(&#x27;rect&#x27;,{x:632,y:34,width:240,height:160,rx:10,class:&#x27;formula-card&#x27;}));
    effectiveGrid.append(el(&#x27;line&#x27;,{x1:650,y1:109,x2:855,y2:109,class:&#x27;grid&#x27;}));
    effectiveMarks.append(el(&#x27;polyline&#x27;,{points,class:&#x27;correlation-line&#x27;}));
    effectiveMarks.append(el(&#x27;text&#x27;,{x:752,y:215,&#x27;text-anchor&#x27;:&#x27;middle&#x27;,class:&#x27;flow-main&#x27;},`ρ = ${rho.toFixed(2)}`));
    effectiveMarks.append(el(&#x27;text&#x27;,{x:752,y:238,&#x27;text-anchor&#x27;:&#x27;middle&#x27;},rho &lt; .2 ? &#x27;weak repetition / 重复较弱&#x27; : rho &lt; .6 ? &#x27;visible repetition / 有明显重复&#x27; : &#x27;strong repetition / 重复很强&#x27;));
    effectiveMarks.append(el(&#x27;text&#x27;,{x:450,y:274,&#x27;text-anchor&#x27;:&#x27;middle&#x27;},`n_eff = n × (1−ρ)/(1+ρ) = ${n} × ${(1-rho).toFixed(2)}/${(1+rho).toFixed(2)} = ${neff.toFixed(1)}`));
  }

  function drawSigma(n, rho, neff, noise, xbar, leverage, sigma) {
    sigmaGrid.replaceChildren(); sigmaMarks.replaceChildren();
    const defs=el(&#x27;defs&#x27;); const marker=el(&#x27;marker&#x27;,{id:&#x27;sigma-arrow&#x27;,viewBox:&#x27;0 0 10 10&#x27;,refX:9,refY:5,markerWidth:6,markerHeight:6,orient:&#x27;auto-start-reverse&#x27;}); marker.append(el(&#x27;path&#x27;,{d:&#x27;M 0 0 L 10 5 L 0 10 z&#x27;,fill:&#x27;var(--muted-foreground)&#x27;})); defs.append(marker); sigmaGrid.append(defs);
    const boxes=[
      {x:28,y:35,w:180,h:78,a:`n = ${n} recorded`,b:&#x27;原始样本数量&#x27;},
      {x:250,y:35,w:180,h:78,a:`ρ = ${rho.toFixed(2)}`,b:&#x27;相邻残差重复程度&#x27;},
      {x:472,y:35,w:180,h:78,a:`n_eff = ${neff.toFixed(1)}`,b:&#x27;真正独立的信息量&#x27;},
      {x:28,y:167,w:180,h:78,a:`s = ${noise.toFixed(1)} m`,b:&#x27;点围绕拟合线的散乱&#x27;},
      {x:250,y:167,w:180,h:78,a:`x̄ = ${Math.round(xbar)} m`,b:`外推杠杆项 ${leverage.toFixed(3)}`},
      {x:618,y:151,w:250,h:94,a:`σ₀ = ${sigma.toFixed(2)} m`,b:&#x27;阈值交点有多不确定&#x27;}
    ];
    boxes.forEach(b=&gt;{sigmaMarks.append(el(&#x27;rect&#x27;,{x:b.x,y:b.y,width:b.w,height:b.h,rx:10,class:&#x27;flow-box&#x27;})); sigmaMarks.append(el(&#x27;text&#x27;,{x:b.x+14,y:b.y+31,class:&#x27;flow-main&#x27;},b.a)); sigmaMarks.append(el(&#x27;text&#x27;,{x:b.x+14,y:b.y+56,class:&#x27;flow-sub&#x27;},b.b));});
    [[208,74,250,74],[430,74,472,74],[562,113,700,151],[208,206,250,206],[430,206,618,194]].forEach(a=&gt;sigmaMarks.append(el(&#x27;path&#x27;,{d:`M${a[0]} ${a[1]} L${a[2]} ${a[3]}`,class:&#x27;flow-arrow&#x27;})));
    sigmaMarks.append(el(&#x27;text&#x27;,{x:450,y:140,&#x27;text-anchor&#x27;:&#x27;middle&#x27;},&#x27;more independent data ↓ sigma / 独立信息越多，sigma 越小&#x27;));
    sigmaMarks.append(el(&#x27;text&#x27;,{x:450,y:274,&#x27;text-anchor&#x27;:&#x27;middle&#x27;},&#x27;more scatter or farther extrapolation ↑ sigma / 越散、外推越远，sigma 越大&#x27;));
  }

  function drawFit(n, noise, rho, nearest, estimate, sigma) {
    fitGrid.replaceChildren(); fitMarks.replaceChildren();
    const x0 = 72, x1 = 858, y0 = 28, y1 = 278;
    const sx = x =&gt; x0 + ((x + 5200) / 5400) * (x1 - x0);
    const sy = y =&gt; y1 - ((y + 15) / 330) * (y1 - y0);
    [-5000,-4000,-3000,-2000,-1000,0].forEach(x =&gt; {
      fitGrid.append(el(&#x27;line&#x27;,{x1:sx(x),y1:y0,x2:sx(x),y2:y1,class:&#x27;grid&#x27;}));
      fitGrid.append(el(&#x27;text&#x27;,{x:sx(x),y:301,&#x27;text-anchor&#x27;:&#x27;middle&#x27;},x === 0 ? &#x27;threshold&#x27; : `${x/1000} km`));
    });
    [0,100,200,300].forEach(y =&gt; {
      fitGrid.append(el(&#x27;line&#x27;,{x1:x0,y1:sy(y),x2:x1,y2:sy(y),class:&#x27;grid&#x27;}));
      fitGrid.append(el(&#x27;text&#x27;,{x:60,y:sy(y)+4,&#x27;text-anchor&#x27;:&#x27;end&#x27;},`${y} m`));
    });
    fitGrid.append(el(&#x27;line&#x27;,{x1:sx(0),y1:y0,x2:sx(0),y2:y1,class:&#x27;threshold&#x27;}));
    fitGrid.append(el(&#x27;text&#x27;,{x:72,y:18},&#x27;Height above target versus distance to threshold&#x27;));
    const slope = -0.0524;
    const lineY = x =&gt; estimate + slope * x;
    fitMarks.append(el(&#x27;line&#x27;,{x1:sx(-5000),y1:sy(lineY(-5000)),x2:sx(nearest),y2:sy(lineY(nearest)),class:&#x27;fit-line&#x27;}));
    fitMarks.append(el(&#x27;line&#x27;,{x1:sx(nearest),y1:sy(lineY(nearest)),x2:sx(0),y2:sy(estimate),class:&#x27;extension&#x27;}));
    const visibleN = Math.min(n, 120);
    const residuals = correlatedResiduals(visibleN, rho, noise);
    for (let i=0;i&lt;visibleN;i++) {
      const x = -5000 + (i/(visibleN-1)) * (5000 + nearest);
      const measured=lineY(x)+residuals[i];
      fitMarks.append(el(&#x27;line&#x27;,{x1:sx(x),y1:sy(lineY(x)),x2:sx(x),y2:sy(measured),class:&#x27;residual&#x27;}));
      fitMarks.append(el(&#x27;circle&#x27;,{cx:sx(x),cy:sy(measured),r:2.8,class:&#x27;sample&#x27;}));
    }
    fitMarks.append(el(&#x27;circle&#x27;,{cx:sx(0),cy:sy(estimate),r:6,class:&#x27;estimate&#x27;}));
    fitMarks.append(el(&#x27;line&#x27;,{x1:sx(0)-8,y1:sy(estimate-1.96*sigma),x2:sx(0)-8,y2:sy(estimate+1.96*sigma),class:&#x27;ci&#x27;}));
    fitMarks.append(el(&#x27;text&#x27;,{x:sx(nearest)-5,y:sy(lineY(nearest))-12,&#x27;text-anchor&#x27;:&#x27;end&#x27;},&#x27;last usable sample&#x27;));
    fitMarks.append(el(&#x27;text&#x27;,{x:sx(nearest)+18,y:sy(lineY(nearest))+20},&#x27;dashed = extrapolation / 虚线是外推&#x27;));
  }

  function drawGate(estimate, sigma, verdict) {
    gateGrid.replaceChildren(); gateMarks.replaceChildren();
    const lo = estimate - 1.96 * sigma, hi = estimate + 1.96 * sigma;
    const min = Math.min(-4.2, estimate - 4.1 * sigma);
    const max = Math.max(7.25, estimate + 4.1 * sigma);
    const x0 = 66, x1 = 858, top = 42, baseline = 248;
    const sx = x =&gt; x0 + (x - min) / (max - min) * (x1 - x0);
    const pdf = x =&gt; Math.exp(-0.5 * Math.pow((x - estimate) / Math.max(0.001, sigma), 2));
    const sy = x =&gt; baseline - pdf(x) * (baseline - top);
    const curvePoints = (a, b, count = 90) =&gt; Array.from({length:count+1},(_,i) =&gt; {
      const x = a + i / count * (b - a);
      return [sx(x), sy(x)];
    });
    const areaPath = (a,b) =&gt; {
      const left = clamp(a,min,max), right = clamp(b,min,max);
      if (right &lt;= left) return &#x27;&#x27;;
      const points = curvePoints(left,right);
      return `M${sx(left)} ${baseline} ` + points.map(point=&gt;`L${point[0]} ${point[1]}`).join(&#x27; &#x27;) + ` L${sx(right)} ${baseline} Z`;
    };
    gateGrid.append(el(&#x27;rect&#x27;,{x:sx(clamp(-3.05,min,max)),y:top-8,width:Math.max(0,sx(clamp(6.1,min,max))-sx(clamp(-3.05,min,max))),height:baseline-top+8,class:&#x27;gate-zone&#x27;}));
    gateGrid.append(el(&#x27;text&#x27;,{x:(sx(clamp(-3.05,min,max))+sx(clamp(6.1,min,max)))/2,y:28,&#x27;text-anchor&#x27;:&#x27;middle&#x27;},&#x27;accepted vertical gate / 允许范围&#x27;));
    gateMarks.append(el(&#x27;path&#x27;,{d:areaPath(min,lo),class:&#x27;normal-tail&#x27;}));
    gateMarks.append(el(&#x27;path&#x27;,{d:areaPath(lo,hi),class:&#x27;normal-fill&#x27;}));
    gateMarks.append(el(&#x27;path&#x27;,{d:areaPath(estimate-sigma,estimate+sigma),class:&#x27;normal-core&#x27;}));
    gateMarks.append(el(&#x27;path&#x27;,{d:areaPath(hi,max),class:&#x27;normal-tail&#x27;}));
    gateMarks.append(el(&#x27;path&#x27;,{d:&#x27;M&#x27;+curvePoints(min,max).map(point=&gt;`${point[0]} ${point[1]}`).join(&#x27; L&#x27;),class:&#x27;normal-line&#x27;}));
    gateGrid.append(el(&#x27;line&#x27;,{x1:x0,y1:baseline,x2:x1,y2:baseline,class:&#x27;axis&#x27;}));
    [-3.05,6.1].forEach(value=&gt;{
      if (value &gt;= min &amp;&amp; value &lt;= max) gateGrid.append(el(&#x27;line&#x27;,{x1:sx(value),y1:top-8,x2:sx(value),y2:baseline+8,class:&#x27;threshold&#x27;}));
    });
    [estimate-sigma,estimate+sigma].forEach(value=&gt;gateMarks.append(el(&#x27;line&#x27;,{x1:sx(value),y1:sy(value),x2:sx(value),y2:baseline,class:&#x27;sigma-marker&#x27;})));
    [lo,hi].forEach(value=&gt;gateMarks.append(el(&#x27;line&#x27;,{x1:sx(value),y1:sy(value),x2:sx(value),y2:baseline+13,class:&#x27;ci-marker&#x27;})));
    gateMarks.append(el(&#x27;line&#x27;,{x1:sx(estimate),y1:top-4,x2:sx(estimate),y2:baseline+8,class:&#x27;threshold&#x27;}));
    gateMarks.append(el(&#x27;circle&#x27;,{cx:sx(estimate),cy:top-4,r:6,class:&#x27;estimate&#x27;}));
    const axisValues = [min,-3.05,estimate,6.1,max].filter((value,index,array)=&gt;array.findIndex(other=&gt;Math.abs(other-value)&lt;0.15)===index).sort((a,b)=&gt;a-b);
    axisValues.forEach(value=&gt;gateGrid.append(el(&#x27;text&#x27;,{x:sx(value),y:276,&#x27;text-anchor&#x27;:&#x27;middle&#x27;},`${fmt(value,1)} m`)));
    gateMarks.append(el(&#x27;text&#x27;,{x:sx(estimate),y:61,&#x27;text-anchor&#x27;:&#x27;middle&#x27;,class:&#x27;flow-main&#x27;},`estimate ${fmt(estimate)} m`));
    gateMarks.append(el(&#x27;text&#x27;,{x:sx(estimate),y:93,&#x27;text-anchor&#x27;:&#x27;middle&#x27;},&#x27;68% within ±1σ&#x27;));
    gateMarks.append(el(&#x27;text&#x27;,{x:(sx(lo)+sx(hi))/2,y:220,&#x27;text-anchor&#x27;:&#x27;middle&#x27;,class:&#x27;flow-main&#x27;},`95%: ${fmt(lo)} to ${fmt(hi)} m`));
    gateMarks.append(el(&#x27;text&#x27;,{x:sx(clamp(lo-(max-min)*.035,min,max)),y:238,&#x27;text-anchor&#x27;:&#x27;end&#x27;},&#x27;2.5% tail&#x27;));
    gateMarks.append(el(&#x27;text&#x27;,{x:sx(clamp(hi+(max-min)*.035,min,max)),y:238},&#x27;2.5% tail&#x27;));
    gateMarks.append(el(&#x27;text&#x27;,{x:450,y:314,&#x27;text-anchor&#x27;:&#x27;middle&#x27;,class:`verdict-${verdict}`},`${verdict.toUpperCase()} · interval ${verdict===&#x27;undecided&#x27;?&#x27;crosses a gate boundary&#x27;:verdict===&#x27;pass&#x27;?&#x27;stays inside the gate&#x27;:&#x27;stays outside a gate limit&#x27;}`));
    gateMarks.append(el(&#x27;text&#x27;,{x:450,y:338,&#x27;text-anchor&#x27;:&#x27;middle&#x27;},&#x27;95% describes repeated fits under the model—not a 95% guarantee for this one flight&#x27;));
  }

  function drawSensitivity(n, rho, noise, nearest) {
    sensitivityGrid.replaceChildren(); sensitivityMarks.replaceChildren();
    const panels = [
      {x:48,y:34,w:365,h:145,title:&#x27;Residual scatter s / 点有多散&#x27;,min:.2,max:8,current:noise,label:v=&gt;`${v.toFixed(1)} m`,sigma:v=&gt;sigmaParts(n,rho,v,nearest).sigma},
      {x:487,y:34,w:365,h:145,title:&#x27;Recorded samples n / 点的数量&#x27;,min:8,max:220,current:n,label:v=&gt;`${Math.round(v)}`,sigma:v=&gt;sigmaParts(v,rho,noise,nearest).sigma},
      {x:48,y:236,w:365,h:145,title:&#x27;Correlation ρ / 相邻点重复度&#x27;,min:0,max:.9,current:rho,label:v=&gt;v.toFixed(2),sigma:v=&gt;sigmaParts(n,v,noise,nearest).sigma},
      {x:487,y:236,w:365,h:145,title:&#x27;Nearest sample / 最后一点位置&#x27;,min:-1200,max:-50,current:nearest,label:v=&gt;`${Math.round(v)} m`,sigma:v=&gt;sigmaParts(n,rho,noise,v).sigma}
    ];
    panels.forEach(panel=&gt;{
      const values = Array.from({length:61},(_,i)=&gt;{
        const input = panel.min + i/60*(panel.max-panel.min);
        return {input,sigma:panel.sigma(input)};
      });
      const yMax = Math.max(...values.map(value=&gt;value.sigma))*1.08;
      const left=panel.x+48,right=panel.x+panel.w-12,top=panel.y+28,bottom=panel.y+panel.h-28;
      const sx=value=&gt;left+(value-panel.min)/(panel.max-panel.min)*(right-left);
      const sy=value=&gt;bottom-value/yMax*(bottom-top);
      sensitivityGrid.append(el(&#x27;rect&#x27;,{x:panel.x,y:panel.y,width:panel.w,height:panel.h,rx:10,class:&#x27;formula-card&#x27;}));
      sensitivityGrid.append(el(&#x27;text&#x27;,{x:panel.x+12,y:panel.y+20,class:&#x27;flow-main&#x27;},panel.title));
      sensitivityGrid.append(el(&#x27;line&#x27;,{x1:left,y1:bottom,x2:right,y2:bottom,class:&#x27;axis&#x27;}));
      sensitivityGrid.append(el(&#x27;line&#x27;,{x1:left,y1:top,x2:left,y2:bottom,class:&#x27;axis&#x27;}));
      sensitivityGrid.append(el(&#x27;text&#x27;,{x:left,y:bottom+19,&#x27;text-anchor&#x27;:&#x27;middle&#x27;},panel.label(panel.min)));
      sensitivityGrid.append(el(&#x27;text&#x27;,{x:right,y:bottom+19,&#x27;text-anchor&#x27;:&#x27;middle&#x27;},panel.label(panel.max)));
      sensitivityGrid.append(el(&#x27;text&#x27;,{x:left-6,y:top+4,&#x27;text-anchor&#x27;:&#x27;end&#x27;},`${yMax.toFixed(1)} m`));
      sensitivityGrid.append(el(&#x27;text&#x27;,{x:left-6,y:bottom+4,&#x27;text-anchor&#x27;:&#x27;end&#x27;},&#x27;0&#x27;));
      sensitivityMarks.append(el(&#x27;path&#x27;,{d:&#x27;M&#x27;+values.map(value=&gt;`${sx(value.input)} ${sy(value.sigma)}`).join(&#x27; L&#x27;),class:&#x27;sensitivity-line&#x27;}));
      const currentSigma=panel.sigma(panel.current);
      sensitivityMarks.append(el(&#x27;circle&#x27;,{cx:sx(panel.current),cy:sy(currentSigma),r:6,class:&#x27;sensitivity-point&#x27;}));
      sensitivityMarks.append(el(&#x27;text&#x27;,{x:clamp(sx(panel.current),left+32,right-32),y:Math.max(top+13,sy(currentSigma)-10),&#x27;text-anchor&#x27;:&#x27;middle&#x27;,class:&#x27;flow-main&#x27;},`σ₀ ${currentSigma.toFixed(2)} m`));
    });
    sensitivityMarks.append(el(&#x27;text&#x27;,{x:450,y:419,&#x27;text-anchor&#x27;:&#x27;middle&#x27;},&#x27;Rising line = this input increases uncertainty · 下降线 = 这个输入会降低不确定性&#x27;));
  }

  function update() {
    const estimate=Number(controls.estimate.value), n=Number(controls.samples.value), noise=Number(controls.noise.value), rho=Number(controls.rho.value), nearest=Number(controls.nearest.value);
    const {neff,xbar,leverage,sigma}=sigmaParts(n,rho,noise,nearest);
    const lo=estimate-1.96*sigma, hi=estimate+1.96*sigma;
    const inside=estimate&gt;=-3.05&amp;&amp;estimate&lt;=6.1;
    const crosses=(lo&lt;=-3.05&amp;&amp;hi&gt;=-3.05)||(lo&lt;=6.1&amp;&amp;hi&gt;=6.1);
    const verdict=crosses?&#x27;undecided&#x27;:inside?&#x27;pass&#x27;:&#x27;fail&#x27;;
    out(&#x27;estimate&#x27;).textContent=`${fmt(estimate)} m`; out(&#x27;samples&#x27;).textContent=n; out(&#x27;noise&#x27;).textContent=`${noise.toFixed(1)} m`; out(&#x27;rho&#x27;).textContent=rho.toFixed(2); out(&#x27;nearest&#x27;).textContent=`${nearest} m`;
    out(&#x27;neff&#x27;).textContent=neff.toFixed(1); out(&#x27;neff-note&#x27;).textContent=`${n} measured`; out(&#x27;sigma&#x27;).textContent=`${sigma.toFixed(2)} m`; out(&#x27;interval&#x27;).textContent=`[${fmt(lo)}, ${fmt(hi)}] m`; out(&#x27;verdict-note&#x27;).textContent=verdict===&#x27;undecided&#x27;?&#x27;crosses a gate&#x27;:verdict===&#x27;pass&#x27;?&#x27;fully inside both limits&#x27;:&#x27;fully outside a limit&#x27;;
    out(&#x27;interval&#x27;).className=`viz-stat-value verdict-${verdict}`;
    drawResiduals(n,rho,noise);
    drawEffective(n,rho,neff,noise);
    drawSigma(n,rho,neff,noise,xbar,leverage,sigma);
    drawFit(n,noise,rho,nearest,estimate,sigma);
    drawGate(estimate,sigma,verdict);
    drawSensitivity(n,rho,noise,nearest);
  }
  Object.values(controls).forEach(control=&gt;control.addEventListener(&#x27;input&#x27;,update));
  update();
})();

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }

    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);

      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)

    }

  };

    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();

      return;

        shift({ padding: tooltipGap }),

            );

              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );

        }),

      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }

        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;

      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;

    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
