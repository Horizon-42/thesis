<text class="label" x="805" y="370">p</text>
<text class="label" x="240" y="73">z</text>
<text class="small" x="236" y="383">O / Z 轴穿出剖面的位置</text>
<text class="orange" x="390.9" y="148.1">S(p_S,z_S)</text>
<text class="teal" x="404.9" y="176.2">S′(p_S+Δp,z_S+Δz)</text>
<text class="small" x="375.9" y="387.0">p_S</text>
<text class="small" x="382.9" y="403.0">p_S+Δp</text>
<text class="teal" x="381.9" y="202.1">Δp</text>
<text class="orange" x="419.9" y="170.6">Δz</text>
<text class="indigo" x="437.4" y="199.6">切线 slope = (dz/dp)|S</text>
<text class="formula" x="42" y="512">割线斜率 = Δz/Δp；令 Δp → 0 后得到导数 (dz/dp)|S。它是切线斜率，不是曲率。</text>
</svg>