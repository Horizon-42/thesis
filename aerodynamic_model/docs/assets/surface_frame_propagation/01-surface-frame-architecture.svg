<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" role="img" aria-labelledby="title">
<title id="title">Surface-frame propagation architecture</title>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#263548"/></marker></defs>
<style>
svg { background: linear-gradient(180deg, #fbfdff 0%, #f3f7fa 100%); }
.title { fill: #16212f; font: 700 22px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
.subtitle { fill: #5f6f7e; font: 500 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
.box { fill: white; stroke: #c8d4df; stroke-width: 1.4; }
.accent { fill: #e7f7f8; stroke: #207b84; stroke-width: 1.4; }
.warn { fill: #fff5e8; stroke: #c2712a; stroke-width: 1.4; }
.axis { stroke: #263548; stroke-width: 2.2; marker-end: url(#arrow); fill: none; }
.north { stroke: #2f62b7; stroke-width: 2.7; marker-end: url(#arrow); fill: none; }
.east { stroke: #007c89; stroke-width: 2.7; marker-end: url(#arrow); fill: none; }
.up { stroke: #9a4c10; stroke-width: 2.7; marker-end: url(#arrow); fill: none; }
.down { stroke: #8f3f71; stroke-width: 2.7; marker-end: url(#arrow); fill: none; stroke-dasharray: 7 5; }
.arrow { stroke: #263548; stroke-width: 2.0; marker-end: url(#arrow); fill: none; }
.helper { stroke: #8292a4; stroke-width: 1.4; stroke-dasharray: 6 5; fill: none; }
.surface { fill: #b65b13; stroke: white; stroke-width: 2.0; }
.point { fill: #007c89; stroke: white; stroke-width: 2.0; }
.label { fill: #16212f; font: 650 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
.small { fill: #4b5d70; font: 500 12.5px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
.teal { fill: #006f79; font: 650 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
.orange { fill: #9a4c10; font: 650 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
.indigo { fill: #314b99; font: 650 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
.magenta { fill: #8f3f71; font: 650 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
.formula { fill: #263548; font: 600 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
</style>
<rect width="980" height="560" fill="#fbfdff"/>
<text class="title" x="34" y="42">总体思路：每步局部 x/y/z 增量，转回 WGS84/ECEF 保存轨迹</text>
<text class="subtitle" x="34" y="66">飞机方程仍在局部切平面里积分；局部 origin 每步更新，长期位置不累计在固定平面</text>
<rect class="accent" x="42" y="122" width="212" height="92" rx="8"/>
<text class="label" x="60" y="152">当前全球位置</text>
<text class="teal" x="60" y="178">φ, λ, h</text>
<text class="small" x="60" y="200">WGS84 geodetic</text>
<rect class="box" x="298" y="122" width="212" height="92" rx="8"/>
<text class="label" x="316" y="152">本步 origin 和局部轴</text>
<text class="teal" x="316" y="178">ê,n̂,û</text>
<text class="small" x="316" y="200">from current φ,λ</text>
<rect class="box" x="554" y="122" width="212" height="92" rx="8"/>
<text class="label" x="572" y="152">局部 solver</text>
<text class="teal" x="572" y="178">x,y,z,V,ψ,γ,m</text>
<text class="small" x="572" y="200">same local equations</text>
<rect class="box" x="298" y="298" width="212" height="92" rx="8"/>
<text class="label" x="316" y="328">本步局部增量</text>
<text class="teal" x="316" y="354">Δr=x ê+y n̂+z û</text>
<text class="small" x="316" y="376">ECEF vector</text>
<rect class="box" x="554" y="298" width="212" height="92" rx="8"/>
<text class="label" x="572" y="328">ECEF 更新</text>
<text class="teal" x="572" y="354">r₁=r₀+Δr</text>
<text class="small" x="572" y="376">then inverse WGS84</text>
<rect class="box" x="810" y="298" width="128" height="92" rx="8"/>
<text class="label" x="828" y="328">下一步</text>
<text class="teal" x="828" y="354">new φ,λ,h</text>
<text class="small" x="828" y="376">new origin</text>
<path class="arrow" d="M254,168 L296,168"/>
<path class="arrow" d="M510,168 L552,168"/>
<path class="arrow" d="M660,214 L410,296"/>
<path class="arrow" d="M510,344 L552,344"/>
<path class="arrow" d="M766,344 L808,344"/>
<text class="formula" x="74" y="468">主方案：x,y,z 每步从 0 开始，只表示这一小步；WGS84/ECEF 才是长期轨迹状态。</text>
<text class="formula" x="74" y="494">速度也要随新 frame 投影：v_ECEF → 新 ê,n̂,û → 新 V,ψ,γ。</text>
<text class="small" x="718" y="420">下一步：新 φ,λ,h 成为新的 origin</text>
</svg>