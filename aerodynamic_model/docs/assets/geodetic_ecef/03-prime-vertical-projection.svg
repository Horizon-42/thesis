<svg xmlns="http://www.w3.org/2000/svg" viewBox="16.0 72.0 934.6 438.0" role="img" aria-labelledby="title">
<title id="title">Projection from parallel-circle curvature to prime-vertical normal curvature</title>
<defs><marker id="arrow" viewBox="0 0 8 6" markerWidth="4.96" markerHeight="3.72" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#263548"/></marker></defs>
<style>
.axis { stroke: #263548; stroke-width: 2.2; marker-end: url(#arrow); }
.ellipse { fill: #e7f7f8; stroke: #207b84; stroke-width: 2.2; }
.helper { stroke: #8292a4; stroke-width: 1.5; stroke-dasharray: 6 5; fill: none; }
.normal { stroke: #b65b13; stroke-width: 2.7; marker-end: url(#arrow); }
.radius { stroke: #3d58a8; stroke-width: 2.4; marker-end: url(#arrow); }
.tangent { stroke: #3d58a8; stroke-width: 2.0; }
.arc { fill: none; stroke: #3d58a8; stroke-width: 1.8; }
.point { fill: #007c89; stroke: white; stroke-width: 2.0; }
.surface { fill: #b65b13; stroke: white; stroke-width: 2.0; }
.label { fill: #16212f; font: 650 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
.small { fill: #4b5d70; font: 500 12.5px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
.orange { fill: #9a4c10; font: 650 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
.teal { fill: #006f79; font: 650 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
.indigo { fill: #314b99; font: 650 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
</style>
<style>
.panel-title { fill: #16212f; font: 700 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
.parallel-circle { fill: #eef8f9; stroke: #007c89; stroke-width: 2.2; }
.kcircle { stroke: #007c89; stroke-width: 3.0; marker-end: url(#arrow); fill: none; }
.projection { stroke: #b65b13; stroke-width: 3.0; marker-end: url(#arrow); fill: none; }
.normal-line { stroke: #b65b13; stroke-width: 2.4; marker-end: url(#arrow); fill: none; }
.panel-box { fill: none; stroke: #d8e1e8; stroke-width: 1.2; }
</style>
<rect class="panel-box" x="30" y="86" width="410" height="410" rx="8"/>
<rect class="panel-box" x="500" y="86" width="410" height="410" rx="8"/>
<text class="panel-title" x="50" y="116">A. Space curvature of the parallel</text>
<text class="panel-title" x="520" y="116">B. Projecting it onto the ellipsoid normal</text>
<circle class="parallel-circle" cx="235.0" cy="300.0" r="150.0"/>
<line class="radius" x1="235.0" y1="300.0" x2="357.9" y2="214.0"/>
<line class="tangent" x1="385.4" y1="253.3" x2="330.3" y2="174.6"/>
<line class="kcircle" x1="357.9" y1="214.0" x2="282.5" y2="266.7"/>
<circle class="surface" cx="357.9" cy="214.0" r="6.2"/>
<circle class="point" cx="235.0" cy="300.0" r="4.8"/>
<text class="small" x="215.0" y="324.0">Z axis</text>
<text class="orange" x="367.9" y="208.0">S</text>
<text class="indigo" x="300.4" y="283.0">ρ = ν cosφ</text>
<text class="teal" x="170.5" y="254.7">κ_circle = 1/ρ</text>
<text class="small" x="391.4" y="261.3">east tangent</text>
<line class="helper" x1="530.0" y1="310.0" x2="757.0" y2="310.0"/>
<line class="kcircle" x1="735.0" y1="310.0" x2="563.0" y2="310.0"/>
<line class="normal-line" x1="735.0" y1="310.0" x2="633.4" y2="448.8"/>
