<line class="helper" x1="563.0" y1="310.0" x2="675.0" y2="392.0"/>
<circle class="surface" cx="735.0" cy="310.0" r="6.2"/>
<circle class="point" cx="675.0" cy="392.0" r="4.8"/>
<path class="arc" d="M 691.0,310.0 A 44.0,44.0 0 0 0 709.0,345.5"/>
<text class="indigo" x="673.0" y="346.0">φ</text>
<text class="teal" x="559.0" y="296.0">horizontal inward q<tspan dx="-0.545em">ˆ</tspan></text>
<text class="orange" x="601.4" y="470.8">inward normal −û</text>
<text class="orange" x="689.0" y="396.0">projection = |κ_circle| cosφ</text>
<text class="small" x="745.0" y="332.0">S</text>
