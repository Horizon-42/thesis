<text class="label" x="842" y="406">p</text>
<text class="label" x="260" y="67">z</text>
<text class="small" x="258" y="418">O</text>
<text class="orange" x="389.8" y="213.1">S</text>
<text class="label" x="469.2" y="164.4">P(p,Z)</text>
<text class="indigo" x="473.2" y="91.0">Cₙ=(p, Z+e²νₙ sinφₙ)</text>
<text class="orange" x="493.2" y="115.7">vertical correction e²νₙ sinφₙ</text>
<text class="small" x="340.6" y="422.0">horizontal side p</text>
<text class="indigo" x="360" y="360">φₙ₊₁ = atan2(z_c,n, p)</text>
<text class="small" x="483.9" y="184.4">initial angle: atan2(Z, p(1-e²))</text>
</svg>