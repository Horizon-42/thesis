<line class="helper" x1="250" y1="400" x2="451.2" y2="126.4"/>
<line class="normal" x1="451.2" y1="126.4" x2="451.2" y2="125.0"/>
<line class="helper" x1="250" y1="400" x2="449.9" y2="126.4"/>
<circle class="surface" cx="409.8" cy="183.1" r="6"/>
<circle class="point" cx="451.2" cy="126.4" r="7"/>
<circle class="point" cx="451.2" cy="125.0" r="5"/>
