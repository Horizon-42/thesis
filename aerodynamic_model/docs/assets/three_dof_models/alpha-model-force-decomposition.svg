<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 760" role="img" aria-labelledby="title">
  <title id="title">Alpha-input 3-DOF model force decomposition</title>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#233143"/>
    </marker>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef5f7"/>
    </linearGradient>
  </defs>
  <style>
    svg { background: #f6f8fb; }
    .panel { fill: url(#panel); stroke: #c9d5df; stroke-width: 1.2; rx: 14; }
    .soft { fill: #eef6f8; stroke: #bdd6dc; stroke-width: 1.2; rx: 10; }
    .warnbox { fill: #fff4e5; stroke: #e1a154; stroke-width: 1.2; rx: 10; }
    .aircraft { fill: #233143; stroke: #ffffff; stroke-width: 2.2; }
    .wing { fill: #67809a; opacity: .95; }
    .horizon { stroke: #9fb0bf; stroke-width: 2; stroke-dasharray: 7 7; }
    .path { stroke: #007c89; stroke-width: 4; fill: none; }
    .axis { stroke: #233143; stroke-width: 2.4; fill: none; }
    .force { stroke: #b65b13; stroke-width: 4; fill: none; }
    .lift { stroke: #2f62b7; stroke-width: 4; fill: none; }
    .drag { stroke: #8f3f71; stroke-width: 4; fill: none; }
    .weight { stroke: #58687a; stroke-width: 4; fill: none; }
    .component { stroke: #7b8b9b; stroke-width: 2.4; stroke-dasharray: 6 5; fill: none; }
    .alpha { stroke: #bf4b34; stroke-width: 3; fill: none; }
    .bank { stroke: #6f48a8; stroke-width: 3; fill: none; }
    .flow { stroke: #007c89; stroke-width: 2.8; fill: none; }
    .danger { stroke: #b7352d; stroke-width: 3.2; fill: none; }
    .dot { fill: #007c89; stroke: #ffffff; stroke-width: 2; }
    .title { fill: #14202f; font: 700 24px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .subtitle { fill: #52677a; font: 500 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .label { fill: #182538; font: 650 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .small { fill: #52677a; font: 500 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .formula { fill: #182538; font: 600 17px "Times New Roman", serif; }
    .mono { fill: #233143; font: 600 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .orange { fill: #9a4c10; font: 700 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .blue { fill: #2f62b7; font: 700 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .violet { fill: #7b3f93; font: 700 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .red { fill: #b7352d; font: 700 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  </style>
  <rect class="panel" x="34.0" y="34.0" width="1052.0" height="692.0"/><text class="title" x="64.0" y="78.0">完整模型：以攻角 α 为输入，先计算 L 与 D，再投影到轨迹方向</text><text class="subtitle" x="66.0" y="104.0">风轴：切向 eV 决定 Vdot；法向合力分解为航向转弯方向与飞行路径角方向</text><line class="horizon" x1="86.0" y1="440.0" x2="642.0" y2="440.0"/><text class="small" x="92.0" y="432.0">local horizon</text><line class="path" x1="255.0" y1="433.0" x2="590.0" y2="339.0"/><line class="axis" x1="365.0" y1="402.0" x2="533.2" y2="353.8" marker-end="url(#arrow)"/><text class="label" x="545.2" y="361.8">V, eV</text><path class="alpha" d="M441,441 A82,82 0 0,0 441,420"/><text class="blue" x="457.0" y="435.0">γ</text><polygon class="wing" points="373.9,397.5 338.0,375.4 329.1,382.1 357.9,405.6 359.9,442.7 370.7,439.5"/><polygon class="wing" points="334.7,417.4 310.5,405.1 306.9,411.4 324.0,422.9 323.3,443.5 330.4,444.3"/><polygon class="aircraft" points="407.8,380.2 370.7,386.8 323.5,413.0 316.9,426.5 331.7,429.1 380.7,406.4"/><line class="force" x1="365.0" y1="402.0" x2="479.0" y2="343.9" marker-end="url(#arrow)"/><path class="alpha" d="M423,384 A72,72 0 0,0 417,370"/><text class="red" x="433.0" y="380.0">α</text><line class="force" x1="365.0" y1="402.0" x2="498.7" y2="333.9" marker-end="url(#arrow)"/><text class="orange" x="495.0" y="334.0">T</text><line class="component" x1="365.0" y1="402.0" x2="491.9" y2="365.6" marker-end="url(#arrow)"/><text class="small" x="493.0" y="382.0">T cos α</text><line class="component" x1="365.0" y1="402.0" x2="339.6" y2="313.6" marker-end="url(#arrow)"/><text class="small" x="307.0" y="308.0">T sin α</text><line class="drag" x1="365.0" y1="402.0" x2="242.0" y2="437.3" marker-end="url(#arrow)"/><text class="violet" x="215.0" y="432.0">D</text><line class="lift" x1="365.0" y1="402.0" x2="332.5" y2="288.6" marker-end="url(#arrow)"/><text class="blue" x="310.5" y="278.6">L</text><line class="weight" x1="365.0" y1="402.0" x2="365.0" y2="552.0" marker-end="url(#arrow)"/><text class="small" x="375.0" y="548.0">mg</text><line class="component" x1="365.0" y1="402.0" x2="280.4" y2="426.3" marker-end="url(#arrow)"/><text class="small" x="250.0" y="464.0">mg sin γ</text><line class="component" x1="365.0" y1="402.0" x2="394.8" y2="505.8" marker-end="url(#arrow)"/><text class="small" x="366.8" y="533.8">mg cos γ</text><ellipse class="soft" cx="760.0" cy="340.0" rx="145.0" ry="72.0"/><line class="lift" x1="760.0" y1="340.0" x2="760.0" y2="228.0" marker-end="url(#arrow)"/><text class="blue" x="774.0" y="242.0">(L + T sin α) cos φ</text><line class="lift" x1="760.0" y1="340.0" x2="890.0" y2="392.0" marker-end="url(#arrow)"/><text class="blue" x="870.0" y="410.0">(L + T sin α) sin φ</text><line class="axis" x1="760.0" y1="340.0" x2="844.0" y2="266.0" marker-end="url(#arrow)"/><text class="label" x="832.0" y="256.0">L + T sin α</text><path class="bank" d="M762,290 A58,58 0 0,1 806,301"/><text class="violet" x="798.0" y="286.0">φ</text><text class="label" x="648.0" y="448.0">法向合力的 bank 分解</text><rect class="soft" x="680.0" y="470.0" width="360.0" height="188.0"/><text class="formula"><tspan x="704.0" dy="0">L = 1/2 ρ V² S CL(α)</tspan><tspan x="704.0" dy="27">D = 1/2 ρ V² S CD(α)</tspan><tspan x="704.0" dy="27">Vdot = (T cosα - D)/m - g sinγ</tspan><tspan x="704.0" dy="27">ψdot = ((L + T sinα) sinφ)/(mV cosγ)</tspan><tspan x="704.0" dy="27">γdot = ((L + T sinα) cosφ - mg cosγ)/(mV)</tspan></text>
</svg>
