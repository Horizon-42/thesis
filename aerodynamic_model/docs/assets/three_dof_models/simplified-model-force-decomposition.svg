<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="760" viewBox="0 0 1120 760" role="img" aria-labelledby="title">
  <title id="title">Simplified load-factor 3-DOF model force decomposition</title>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#233143"/>
    </marker>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef5f7"/>
    </linearGradient>
  </defs>
  <style>
    svg { background: #f6f8fb; }
    .panel { fill: url(#panel); stroke: #c9d5df; stroke-width: 1.2; rx: 14; }
    .soft { fill: #eef6f8; stroke: #bdd6dc; stroke-width: 1.2; rx: 10; }
    .warnbox { fill: #fff4e5; stroke: #e1a154; stroke-width: 1.2; rx: 10; }
    .aircraft { fill: #233143; stroke: #ffffff; stroke-width: 2.2; }
    .wing { fill: #67809a; opacity: .95; }
    .horizon { stroke: #9fb0bf; stroke-width: 2; stroke-dasharray: 7 7; }
    .path { stroke: #007c89; stroke-width: 4; fill: none; }
    .axis { stroke: #233143; stroke-width: 2.4; fill: none; }
    .force { stroke: #b65b13; stroke-width: 4; fill: none; }
    .lift { stroke: #2f62b7; stroke-width: 4; fill: none; }
    .drag { stroke: #8f3f71; stroke-width: 4; fill: none; }
    .weight { stroke: #58687a; stroke-width: 4; fill: none; }
    .component { stroke: #7b8b9b; stroke-width: 2.4; stroke-dasharray: 6 5; fill: none; }
    .alpha { stroke: #bf4b34; stroke-width: 3; fill: none; }
    .bank { stroke: #6f48a8; stroke-width: 3; fill: none; }
    .flow { stroke: #007c89; stroke-width: 2.8; fill: none; }
    .danger { stroke: #b7352d; stroke-width: 3.2; fill: none; }
    .dot { fill: #007c89; stroke: #ffffff; stroke-width: 2; }
    .title { fill: #14202f; font: 700 24px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .subtitle { fill: #52677a; font: 500 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .label { fill: #182538; font: 650 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .small { fill: #52677a; font: 500 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .formula { fill: #182538; font: 600 17px "Times New Roman", serif; }
    .mono { fill: #233143; font: 600 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .orange { fill: #9a4c10; font: 700 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .blue { fill: #2f62b7; font: 700 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .violet { fill: #7b3f93; font: 700 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .red { fill: #b7352d; font: 700 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  </style>
  <rect class="panel" x="34.0" y="34.0" width="1052.0" height="692.0"/><text class="title" x="64.0" y="78.0">简化模型：以载荷因子 n 为输入，直接令 L = nmg</text><text class="subtitle" x="66.0" y="104.0">假设 α≈0、推力沿速度方向；n 是控制命令，但 stall 时只能实现 n_actual</text><line class="horizon" x1="84.0" y1="434.0" x2="650.0" y2="434.0"/><line class="path" x1="255.0" y1="425.0" x2="590.0" y2="355.0"/><line class="axis" x1="365.0" y1="402.0" x2="533.2" y2="366.2" marker-end="url(#arrow)"/><text class="label" x="545.2" y="370.2">V</text><polygon class="wing" points="374.8,399.9 345.8,369.3 335.4,373.5 357.2,403.7 349.6,440.0 360.7,439.7"/><polygon class="wing" points="331.7,409.1 311.5,390.9 306.5,396.0 320.0,411.6 314.0,431.2 320.7,433.9"/><polygon class="aircraft" points="412.0,392.0 374.5,388.7 322.0,401.9 312.2,413.2 325.8,419.5 379.0,410.3"/><line class="force" x1="365.0" y1="402.0" x2="511.7" y2="370.8" marker-end="url(#arrow)"/><text class="orange" x="497.0" y="374.0">T</text><line class="drag" x1="365.0" y1="402.0" x2="242.7" y2="428.0" marker-end="url(#arrow)"/><text class="violet" x="219.0" y="427.0">D</text><line class="lift" x1="365.0" y1="402.0" x2="338.0" y2="274.8" marker-end="url(#arrow)"/><text class="blue" x="288.0" y="266.8">L = nmg</text><line class="weight" x1="365.0" y1="402.0" x2="365.0" y2="550.0" marker-end="url(#arrow)"/><text class="small" x="383.0" y="560.0">mg</text><line class="component" x1="365.0" y1="402.0" x2="278.9" y2="420.3" marker-end="url(#arrow)"/><text class="small" x="250.0" y="456.0">mg sin γ</text><line class="component" x1="365.0" y1="402.0" x2="389.5" y2="517.4" marker-end="url(#arrow)"/><text class="small" x="401.5" y="541.4">mg cos γ</text><ellipse class="soft" cx="765.0" cy="334.0" rx="142.0" ry="72.0"/><line class="lift" x1="765.0" y1="334.0" x2="765.0" y2="222.0" marker-end="url(#arrow)"/><text class="blue" x="779.0" y="240.0">nmg cos μ</text><line class="lift" x1="765.0" y1="334.0" x2="895.0" y2="384.0" marker-end="url(#arrow)"/><text class="blue" x="873.0" y="402.0">nmg sin μ</text><line class="axis" x1="765.0" y1="334.0" x2="849.0" y2="260.0" marker-end="url(#arrow)"/><text class="label" x="859.0" y="286.0">nmg</text><path class="bank" d="M768,285 A57,57 0 0,1 811,295"/><text class="violet" x="803.0" y="280.0">μ</text><text class="label" x="659.0" y="442.0">载荷因子的 bank 分解</text><rect class="soft" x="680.0" y="470.0" width="360.0" height="188.0"/><text class="formula" x="704.0" y="506.0"><tspan x="704.0" dy="0">L = nmg</tspan><tspan x="704.0" dy="27">D = 1/2 ρ V² S CD(CL_req)</tspan><tspan x="704.0" dy="27">Vdot = (T - D)/m - g sinγ</tspan><tspan x="704.0" dy="27">ψdot = g n sinμ/(V cosγ)</tspan><tspan x="704.0" dy="27">γdot = g(n cosμ - cosγ)/V</tspan></text>
</svg>
