[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["aerodynamic_model/tests"]
# The defaults plus `archive`: 4dTrajectory/ts_transformer/archive/<campaign>/tests/ holds the
# frozen tests of archived code, which must stay off the import path (ts tests/test_architecture.py).
norecursedirs = [".*", "*.egg", "_darcs", "build", "CVS", "dist", "node_modules", "venv", "{arch}", "archive"]
